<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#087b6a">
  <title>KHARCHA – Student Expense Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./kharcha.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <button class="brand" data-action="nav" data-view="dashboard" aria-label="Kharcha dashboard">
        <span class="brand-mark">₹</span><span>kharcha</span>
      </button>
      <nav id="navigation" aria-label="Main navigation"></nav>
      <div class="sidebar-user" id="sidebarUser"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="mobileMenu" aria-label="Open navigation">☰</button>
        <div>
          <p class="eyebrow" id="eyebrow">Overview</p>
          <h1 id="pageTitle">Dashboard</h1>
        </div>
        <div class="topbar-actions">
          <label class="topbar-search" aria-label="Search transactions">
            <span aria-hidden="true">⌕</span>
            <input id="globalSearch" type="search" placeholder="Search transactions">
          </label>
          <button class="icon-button" id="languageButton" aria-label="Change language">हि/A</button>
          <button class="icon-button" id="themeButton" aria-label="Toggle theme">◐</button>
          <button class="icon-button notification-button" id="notificationButton" aria-label="Notifications">
            ♢<span class="notification-dot" id="notificationDot" hidden></span>
          </button>
          <button class="profile-button" id="profileButton" data-action="nav" data-view="profile" aria-label="Open profile" hidden></button>
          <button class="button secondary auth-button" id="authButton">Log in</button>
        </div>
      </header>
      <section id="content" class="content" aria-live="polite"></section>
    </main>
  </div>

  <div class="modal-backdrop" id="authModal" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="authTitle">
      <div class="modal-head">
        <div><p class="eyebrow">Kharcha account</p><h2 id="authTitle">Welcome back</h2></div>
        <button class="icon-button" data-close-modal="authModal" aria-label="Close">×</button>
      </div>
      <div class="segmented" id="authTabs">
        <button class="active" data-auth-tab="login">Log in</button>
        <button data-auth-tab="signup">Sign up</button>
      </div>
      <form id="authForm" class="form-grid"></form>
    </section>
  </div>

  <div class="modal-backdrop" id="transactionModal" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="transactionTitle">
      <div class="modal-head"><div><p class="eyebrow">Transaction</p><h2 id="transactionTitle">Add expense</h2></div><button class="icon-button" data-close-modal="transactionModal" aria-label="Close">×</button></div>
      <form id="transactionForm" class="form-grid"></form>
    </section>
  </div>

  <div class="modal-backdrop" id="transactionDetailsModal" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="detailsTitle">
      <div class="modal-head"><div><p class="eyebrow">Transaction details</p><h2 id="detailsTitle">Transaction</h2></div><button class="icon-button" data-close-modal="transactionDetailsModal" aria-label="Close">×</button></div>
      <div id="transactionDetails"></div>
    </section>
  </div>

  <div class="modal-backdrop" id="categoryModal" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="categoryTitle">
      <div class="modal-head"><div><p class="eyebrow">Categories</p><h2 id="categoryTitle">Add category</h2></div><button class="icon-button" data-close-modal="categoryModal" aria-label="Close">×</button></div>
      <form id="categoryForm" class="form-grid"></form>
    </section>
  </div>

  <div id="notificationPanel" class="notification-panel" hidden></div>
  <div id="toastRegion" class="toast-region" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
